agent_name: Agent
agentic_framework: langchain
llm_provider: vertexai
model: gemini-2.0-flash-001
security:
  auth_type: api_key
  rate_limit: 60
  encryption: true
content_filtering: true
model_armor:
  enabled: false
  prompt_injection_detection: false
  jailbreak_detection: false
  toxic_content_filter: false
  pii_detection: false
error_handling:
  ai_managed: false
  retry_attempts: 3
  retry_strategy: exponential
  timeout: 30
  circuit_breaker: false
input_validation: true
output_validation: true
checkpoints: {}
validation_mode: strict
failure_handling: {}
explainability: true
deployment:
  platform: gcp
  region: us-central1